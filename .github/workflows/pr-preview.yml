name: PR Preview & Staging CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-staging-preview:
    name: Staging & PR Preview Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Lint 🔍
        run: npm run lint

      - name: Run Tests 🧪
        run: npm test -- --run

      - name: Build Preview 🏗️
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Upload Staging Preview Artifact 📦
        uses: actions/upload-artifact@v7
        with:
          name: staging-build-pr-${{ github.event.number }}
          path: dist/
          retention-days: 7

      - name: Post PR Preview Status Comment 💬
        uses: actions/github-script@v7
        if: github.event.name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const message = `### 🚀 Staging & PR Preview Build Passed!\n\n` +
              `- **Linting & Tests:** Passed 100%\n` +
              `- **Preview Artifact:** Downloadable from workflow run actions\n` +
              `- **Status:** Ready for review and merge into \`main\`.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
