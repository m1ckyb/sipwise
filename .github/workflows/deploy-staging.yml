name: Build and Deploy (Staging)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Lint 🔍
        run: npm run lint

      - name: Run Frontend Tests 🧪
        run: npm test -- --run
        env:
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
          ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars

      - name: Run Backend Tests 🧪
        run: cd server && npm ci && npm test -- --run
        env:
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
          ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars

      - name: Build 🏗️
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VITE_VAPID_PUBLIC_KEY }}

      - name: Deploy Frontend 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Setup Supabase CLI ⚙️
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Database Migrations 🗄️
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration repair --status applied 20260719182000 --password "$SUPABASE_DB_PASSWORD"
          supabase migration repair --status applied 20260719183500 --password "$SUPABASE_DB_PASSWORD"
          supabase migration repair --status applied 20260728215000 --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Deploy Supabase API Edge Functions ☁️
        run: |
          supabase functions deploy api --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} --no-verify-jwt
          supabase functions deploy check-alerts --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}

      - name: Verify Post-Deployment Health Check 🏥
        run: |
          echo "Running post-deployment API health check..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "https://${{ secrets.STAGING_SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/api" || true)
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 401 ]; then
            echo "::error::Post-deployment health check failed with status $STATUS. Rollback required."
            exit 1
          fi
          echo "Post-deployment health check passed (HTTP status $STATUS)."

  docker-build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
      ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars
      ALLOWED_ORIGINS: http://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: docker compose build

      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sipwise-api
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Start stack and run health check
        run: |
          docker compose up -d
          sleep 15
          curl -f http://localhost/api/health || (docker compose logs frontend && exit 1)
          docker compose down
