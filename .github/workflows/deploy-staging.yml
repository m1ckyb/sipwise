name: Build and Deploy (Staging)

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Lint 🔍
        run: npm run lint

      - name: Run Frontend Tests 🧪
        run: npm test -- --run
        env:
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
          ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars

      - name: Run Backend Tests 🧪
        run: cd server && npm ci && npm test -- --run
        env:
          JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
          ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars

      - name: Build 🏗️
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VITE_VAPID_PUBLIC_KEY }}

      - name: Deploy Staging Frontend 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages-staging

      - name: Check Staging Supabase Secrets 🔑
        id: check-supabase
        env:
          HAS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN != '' }}
          HAS_PROJECT: ${{ secrets.STAGING_SUPABASE_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_PROJECT" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Staging Supabase secrets not configured; skipping Supabase deployment steps."
          fi

      - name: Setup Supabase CLI ⚙️
        if: steps.check-supabase.outputs.enabled == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Database Migrations 🗄️
        if: steps.check-supabase.outputs.enabled == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration repair --remote --status applied 20260719182000 --password "$SUPABASE_DB_PASSWORD"
          supabase migration repair --remote --status applied 20260719183500 --password "$SUPABASE_DB_PASSWORD"
          supabase migration repair --remote --status applied 20260728215000 --password "$SUPABASE_DB_PASSWORD"
          supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Deploy Supabase API Edge Functions ☁️
        if: steps.check-supabase.outputs.enabled == 'true'
        run: |
          supabase functions deploy api --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} --no-verify-jwt
          supabase functions deploy check-alerts --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}

      - name: Verify Post-Deployment Health Check 🏥
        if: steps.check-supabase.outputs.enabled == 'true'
        run: |
          echo "Running post-deployment API health check..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "https://${{ secrets.STAGING_SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/api" || true)
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 401 ]; then
            echo "::error::Post-deployment health check failed with status $STATUS. Rollback required."
            exit 1
          fi
          echo "Post-deployment health check passed (HTTP status $STATUS)."

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci-test-postgres-password
      JWT_SECRET: ci-test-secret-must-be-at-least-32-chars
      ENCRYPTION_SECRET: ci-test-encryption-secret-must-be-at-least-32-chars
      ALLOWED_ORIGINS: https://localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: docker compose build

      - name: Run Trivy vulnerability scanner (API)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sipwise-api
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sipwise-frontend
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

      - name: Start stack and run health check
        run: |
          docker compose up -d
          for i in $(seq 1 15); do
            if curl -sfkL https://localhost/api/health | grep -q '"status":"ok"'; then
              echo "Health check passed"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1
