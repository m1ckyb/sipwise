services:
  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sipwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sipwise
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipwise"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sipwise:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@pg:5432/sipwise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET in .env (min 32 chars)}
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=200"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env (e.g. https://yourdomain.com)}
      TRUST_PROXY: "true"
    # Port 3000 is NOT exposed externally — all traffic routes through Caddy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Set to your domain name for automatic TLS via Let's Encrypt.
      # Use localhost (default) for local development — Caddy uses its internal CA.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'set -o pipefail; if [ -n "$$S3_BACKUP_BUCKET" ]; then apk add --no-cache aws-cli; fi; mkdir -p /backups; while true; do
        echo "[$$(date -Iseconds)] Starting backup...";
        FILENAME=sipwise_$$(date +%Y%m%d_%H%M%S).sql.gz;
        TMPFILE=/backups/.$$FILENAME.tmp;
        if pg_dump -U sipwise -h pg sipwise | gzip > "$$TMPFILE" && [ -s "$$TMPFILE" ] && gunzip -t "$$TMPFILE" 2>/dev/null; then
          mv "$$TMPFILE" "/backups/$$FILENAME";
          if [ -n "$$S3_BACKUP_BUCKET" ]; then
            aws s3 cp "/backups/$$FILENAME" "s3://$$S3_BACKUP_BUCKET/" --sse AES256 || echo "[$$(date -Iseconds)] WARNING: S3 upload failed!";
          fi;
        else
          rm -f "$$TMPFILE";
          echo "[$$(date -Iseconds)] ERROR: Backup dump or integrity check failed!";
        fi;
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        echo "[$$(date -Iseconds)] Backup cycle complete. Next backup in 24h.";
        sleep 86400;
      done'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  pgdata:
  caddy_data:
  caddy_config:
