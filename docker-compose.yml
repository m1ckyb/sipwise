services:
  pg:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sipwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sipwise}
      POSTGRES_DB: sipwise
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sipwise"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sipwise:${POSTGRES_PASSWORD:-sipwise}@pg:5432/sipwise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?Set ENCRYPTION_SECRET in .env (min 32 chars)}
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=200"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS in .env (e.g. https://yourdomain.com)}
      TRUST_PROXY: "true"
    # Port 3000 is NOT exposed externally — all traffic routes through Caddy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Set to your domain name for automatic TLS via Let's Encrypt.
      # Use localhost (default) for local development — Caddy uses its internal CA.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-sipwise}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'apk add --no-cache aws-cli && mkdir -p /backups && while true; do
        echo "[$(date -Iseconds)] Starting backup...";
        FILENAME=sipwise_$$(date +%Y%m%d_%H%M%S).sql.gz
        pg_dump -U sipwise -h pg sipwise | gzip > /backups/$$FILENAME && gunzip -t /backups/$$FILENAME 2>/dev/null || echo "[$(date -Iseconds)] WARNING: Backup integrity check failed!";
        if [ -n "$$S3_BACKUP_BUCKET" ]; then
          aws s3 cp /backups/$$FILENAME s3://$$S3_BACKUP_BUCKET/ || echo "[$(date -Iseconds)] WARNING: S3 upload failed!";
        fi
        find /backups -name "*.sql.gz" -mtime +30 -delete;
        echo "[$(date -Iseconds)] Backup complete. Next backup in 24h.";
        sleep 86400;
      done'

volumes:
  pgdata:
  caddy_data:
  caddy_config:
